[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-output-steganography-detector"
version = "0.1.0"
description = "Entropy and zero-width character scanner detecting covert exfiltration channels in agent text"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-output-steganography-detector = "agent_output_steganography_detector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_output_steganography_detector*"]
